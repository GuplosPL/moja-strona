<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235865F2'/><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-size='55' font-weight='bold' fill='white' font-family='sans-serif'>G</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #111214; color: #dbdee1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .glow { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.15); }
        .btn { display: inline-block; margin-top: 2rem; padding: 0.75rem 2rem; background: #5865F2; color: white; text-decoration: none; font-weight: 600; font-size: 0.9rem; border-radius: 999px; transition: background 0.2s; }
        .btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <h1 class="glow" style="font-size: 7rem; font-weight: 900; color: white; line-height: 1;">404</h1>
    <p id="msg" style="font-size: 1.2rem; color: #949ba4; margin-top: 0.5rem;">Strona nie została znaleziona</p>
    <a id="btn" href="/" class="btn">Wróć do strony głównej</a>
    <script>
        const lang = localStorage.getItem('lang') || (navigator.language.startsWith('pl') ? 'pl' : 'en');
        if (lang !== 'pl') {
            document.getElementById('msg').textContent = 'Page not found';
            document.getElementById('btn').textContent = 'Back to homepage';
        }
    </script>
</body>
</html>
