<!DOCTYPE html>
<html lang="pl">
<head>
    <script>var t=null;try{t=localStorage.getItem('theme')}catch(e){};document.documentElement.setAttribute('data-theme',(t==='dark'||t==='oled')?t:'oled');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolory producentów – Guplos PL</title>
    <meta name="description" content="Kolory producentów – narzędzie z paletami kolorów marek.">
    <meta property="og:title" content="Kolory producentów – Guplos PL">
    <meta property="og:description" content="Kolory producentów – narzędzie z paletami kolorów marek.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moja-strona-yi0.pages.dev/narzedzia/kolory-producentow">
    <meta property="og:image" content="https://moja-strona-yi0.pages.dev/tlo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kolory producentów – Guplos PL">
    <meta name="twitter:description" content="Kolory producentów – narzędzie z paletami kolorów marek.">
    <meta name="twitter:image" content="https://moja-strona-yi0.pages.dev/tlo.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235865F2'/><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-size='55' font-weight='bold' fill='white' font-family='sans-serif'>G</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .page-reveal { opacity: 0; transform: scale(0.97); filter: blur(8px); animation: pageReveal 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes pageReveal { to { opacity: 1; transform: scale(1); filter: blur(0); } }
        .fade-in { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(4px); transition: opacity 0.6s ease-out, transform 0.6s ease-out, filter 0.6s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        html, body { -ms-overflow-style: none; scrollbar-width: none; }
        .make-tab { padding: 0.35rem 0.9rem; font-size: 0.8rem; font-weight: 600; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); cursor: pointer; transition: all 0.15s ease; }
        .make-tab:hover { background: var(--card-hover); color: var(--text-bright); }
        .make-tab.active { background: #5865F2; border-color: #5865F2; color: #fff; }
        .swatch { border: 1px solid rgba(255,255,255,0.14); }
        @media (hover: none), (pointer: coarse) {
            .blur-\[120px\] { display: none; }
            .blur-\[100px\] { display: none; }
            nav { backdrop-filter: none !important; background: var(--bg-elev) !important; }
            .page-reveal, .fade-in { filter: none !important; transition: opacity 0.5s ease-out, transform 0.5s ease-out !important; }
        }
    </style>
    <script>history.scrollRestoration='manual'</script>
</head>
<body class="font-['Inter'] antialiased min-h-screen flex flex-col" style="color: var(--text); background: var(--bg);">
    <div id="progress-bar" class="fixed top-0 left-0 w-0 h-[2px] z-[100] bg-[#5865F2]" style="transition: width 50ms linear; box-shadow: 0 0 8px rgba(88,101,242,0.5);"></div>
    <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-60 -right-40 w-[600px] h-[600px] rounded-full bg-[#5865F2]/15 blur-[120px]"></div>
        <div class="absolute -bottom-40 -left-40 w-[500px] h-[500px] rounded-full bg-[#5865F2]/8 blur-[100px]"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 border-b" style="background: var(--bg-elev); border-color: var(--card-border);">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="font-extrabold text-lg tracking-tight no-underline" style="color: var(--text-bright); text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.15);">#GOODDAYS</a>
            <div class="hidden md:flex items-center gap-2">
                <a href="/" class="px-4 py-2 text-sm font-medium nav-link" data-i18n="nav-home">Strona główna</a>
                <a href="/#gallery" class="px-4 py-2 text-sm font-medium nav-link" data-i18n="nav-gallery">Galeria</a>
                <div class="relative">
                    <button id="tools-btn" class="px-4 py-2 text-sm font-medium nav-link flex items-center gap-1">Narzędzia<svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" class="transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg></button>
                    <div id="tools-menu" class="hidden absolute top-full left-0 mt-2 z-[60] w-48 p-2 rounded-xl border" style="background: var(--bg-elev); border-color: var(--card-border);">
                        <a href="/narzedzia/kolory-producentow" class="block px-3 py-2 text-sm rounded-lg nav-link" data-i18n="tools-colors">Kolory producentów</a>
                    </div>
                </div>
                <a href="/faq" class="px-4 py-2 text-sm font-medium nav-link" data-i18n="nav-faq">FAQ</a>
                <div class="relative">
                    <button id="theme-btn" class="w-9 h-9 rounded-full flex items-center justify-center icon-btn transition-all" title="Theme">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></svg>
                    </button>
                    <div id="theme-menu" class="hidden absolute top-full right-0 mt-2 z-[60] w-40 p-2 rounded-xl border" style="background: var(--bg-elev); border-color: var(--card-border);">
                        <button data-theme-opt="oled" class="theme-opt w-full px-3 py-2 text-sm text-left rounded-lg flex items-center justify-between"><span>OLED</span><span class="theme-check hidden text-[#5865F2]">✓</span></button>
                        <button data-theme-opt="dark" class="theme-opt w-full px-3 py-2 text-sm text-left rounded-lg flex items-center justify-between"><span data-i18n="theme-dark">Czarny</span><span class="theme-check hidden text-[#5865F2]">✓</span></button>
                    </div>
                </div>
                <button id="lang-toggle" class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold icon-btn transition-all" style="text-shadow: 0 0 8px rgba(255,255,255,0.2);">EN</button>
            </div>
            <div class="flex items-center gap-2 md:hidden">
                <div class="relative">
                    <button id="theme-btn-mobile" class="w-11 h-11 rounded-full flex items-center justify-center icon-btn transition-all" title="Theme">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></svg>
                    </button>
                    <div id="theme-menu-mobile" class="hidden absolute top-full right-0 mt-2 z-[60] w-40 p-2 rounded-xl border" style="background: var(--bg-elev); border-color: var(--card-border);">
                        <button data-theme-opt="oled" class="theme-opt w-full px-3 py-2 text-sm text-left rounded-lg flex items-center justify-between"><span>OLED</span><span class="theme-check hidden text-[#5865F2]">✓</span></button>
                        <button data-theme-opt="dark" class="theme-opt w-full px-3 py-2 text-sm text-left rounded-lg flex items-center justify-between"><span data-i18n="theme-dark">Czarny</span><span class="theme-check hidden text-[#5865F2]">✓</span></button>
                    </div>
                </div>
                <button id="lang-toggle-mobile" class="w-11 h-11 rounded-full flex items-center justify-center text-xs font-bold icon-btn transition-all" style="text-shadow: 0 0 8px rgba(255,255,255,0.2);">EN</button>
                <button id="menu-btn" class="w-11 h-11 rounded-full flex flex-col items-center justify-center gap-[6px] icon-btn transition-all" aria-label="Menu">
                    <span class="menu-line block w-5 h-[2px] bg-current rounded-full transition-all"></span>
                    <span class="menu-line block w-5 h-[2px] bg-current rounded-full transition-all"></span>
                    <span class="menu-line block w-5 h-[2px] bg-current rounded-full transition-all"></span>
                </button>
            </div>
        </div>
        <div class="md:hidden">
            <div class="mobile-menu-wrap grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out border-t" style="background: var(--bg-elev); border-color: var(--card-border);">
                <div class="overflow-hidden">
                    <div class="flex flex-col items-center gap-1 px-6 py-4">
                        <a href="/" class="w-full py-4 text-sm font-medium nav-item-mobile rounded-lg text-center" data-i18n="nav-home">Strona główna</a>
                        <a href="/#gallery" class="w-full py-4 text-sm font-medium nav-item-mobile rounded-lg text-center" data-i18n="nav-gallery">Galeria</a>
                        <a href="/narzedzia/kolory-producentow" class="w-full py-4 text-sm font-medium nav-item-mobile rounded-lg text-center" data-i18n="tools-colors">Kolory producentów</a>
                        <a href="/faq" class="w-full py-4 text-sm font-medium nav-item-mobile rounded-lg text-center" data-i18n="nav-faq">FAQ</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-reveal relative z-10 flex-1 flex flex-col">

        <section class="flex-1 max-w-5xl mx-auto px-6 pt-28 pb-16 w-full">
            <h1 class="text-3xl md:text-4xl font-black tracking-tight text-center mb-6 fade-in" data-i18n="colors-title" style="color: var(--text-bright); text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.15);">Kolory producentów</h1>

            <div class="max-w-3xl mx-auto mb-6 fade-in">
                <div class="relative">
                    <input id="search-input" type="text" class="w-full px-6 py-4 pr-14 rounded-2xl border text-lg outline-none transition-colors" data-i18n-placeholder="colors-search" placeholder="Szukaj koloru…" style="background: var(--card); border-color: var(--card-border); color: var(--text);">
                    <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="color: var(--muted);"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
            </div>

            <div id="makes-bar" class="flex flex-wrap justify-center gap-2 mb-8 fade-in"></div>

            <div id="colors-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <p id="empty-msg" class="text-center text-sm py-16" data-i18n="colors-pick" style="color: var(--muted-2);">Wybierz markę lub wpisz szukany kolor, aby zobaczyć kolory</p>
        </section>

        <footer class="text-center py-6 text-sm border-t" style="color: var(--muted-2); border-color: var(--card-border);">
            &copy; <span id="year">2026</span> Guplos PL
        </footer>

    </div>

    <script src="/tsparticles.bundle.min.js"></script>
    <script>
    // Page reveal
    const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.2 });
    document.querySelectorAll('.fade-in').forEach(el => revealObserver.observe(el));

    // Theme switcher
    const themeBtns = [document.getElementById('theme-btn'), document.getElementById('theme-btn-mobile')].filter(Boolean);
    const themeMenus = [document.getElementById('theme-menu'), document.getElementById('theme-menu-mobile')].filter(Boolean);
    let currentTheme = (function(){try{return localStorage.getItem('theme')}catch(e){return null}})() || 'oled';
    if (currentTheme !== 'dark' && currentTheme !== 'oled') currentTheme = 'oled';
    function applyTheme(t, save = true) {
        currentTheme = t;
        document.documentElement.setAttribute('data-theme', t);
        if (save) { try { localStorage.setItem('theme', t); } catch (e) {} }
        themeMenus.forEach(m => m.querySelectorAll('.theme-check').forEach(c => c.classList.add('hidden')));
        themeMenus.forEach(m => {
            const opt = m.querySelector('[data-theme-opt="' + t + '"]');
            if (opt) opt.querySelector('.theme-check').classList.remove('hidden');
        });
    }
    themeBtns.forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        const menu = btn.id === 'theme-btn' ? themeMenus[0] : themeMenus[1];
        themeMenus.forEach(m => { if (m !== menu) m.classList.add('hidden'); });
        menu.classList.toggle('hidden');
    }));
    themeMenus.forEach(menu => menu.querySelectorAll('[data-theme-opt]').forEach(opt => {
        opt.addEventListener('click', e => {
            e.stopPropagation();
            applyTheme(opt.dataset.themeOpt);
            menu.classList.add('hidden');
        });
    }));
    document.addEventListener('click', () => themeMenus.forEach(m => m.classList.add('hidden')));
    applyTheme(currentTheme, false);
    // Tools dropdown
    const toolsBtn = document.getElementById('tools-btn');
    const toolsMenu = document.getElementById('tools-menu');
    if (toolsBtn && toolsMenu) {
        toolsBtn.addEventListener('click', e => {
            e.stopPropagation();
            toolsMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', () => toolsMenu.classList.add('hidden'));
    }
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.querySelector('.mobile-menu-wrap');
    menuBtn.addEventListener('click', () => {
        const open = mobileMenu.classList.contains('grid-rows-[1fr]');
        mobileMenu.classList.toggle('grid-rows-[1fr]', !open);
        menuBtn.classList.toggle('active', !open);
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
        mobileMenu.classList.remove('grid-rows-[1fr]');
        menuBtn.classList.remove('active');
    }));

    // Language switcher
    const translations = {
        pl: {
            'nav-home': 'Strona główna', 'nav-gallery': 'Galeria', 'nav-faq': 'FAQ',
            'tools-colors': 'Kolory producentów',
            'theme-dark': 'Czarny',
            'colors-title': 'Kolory producentów',
            'colors-search': 'Szukaj koloru…',
            'colors-empty': 'Brak wyników',
            'colors-pick': 'Wybierz markę lub wpisz szukany kolor, aby zobaczyć kolory'
        },
        en: {
            'nav-home': 'Home', 'nav-gallery': 'Gallery', 'nav-faq': 'FAQ',
            'tools-colors': 'Producer colors',
            'theme-dark': 'Dark',
            'colors-title': 'Producer colors',
            'colors-search': 'Search color…',
            'colors-empty': 'No results',
            'colors-pick': 'Choose a brand or type a color to see results'
        }
    };
    let lang = (function(){try{return localStorage.getItem('lang')}catch(e){return null}})() || (navigator.language.startsWith('pl') ? 'pl' : 'en');
    function applyLang(l) {
        lang = l;
        try { localStorage.setItem('lang', l); } catch (e) {}
        document.documentElement.lang = l;
        const label = l === 'pl' ? 'EN' : 'PL';
        document.getElementById('lang-toggle').textContent = label;
        document.getElementById('lang-toggle-mobile').textContent = label;
        const t = translations[l];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.setAttribute('placeholder', t[key]);
        });
    }
    document.getElementById('lang-toggle').addEventListener('click', () => applyLang(lang === 'pl' ? 'en' : 'pl'));
    document.getElementById('lang-toggle-mobile').addEventListener('click', () => applyLang(lang === 'pl' ? 'en' : 'pl'));
    applyLang(lang);

    // Producer colors
    const grid = document.getElementById('colors-grid');
    const makesBar = document.getElementById('makes-bar');
    const searchInput = document.getElementById('search-input');
    const emptyMsg = document.getElementById('empty-msg');

    let allColors = [];
    let currentMake = null;
    let searchQuery = '';

    function hslColor(c) {
        const h = Math.round(c.h * 360);
        const s = Math.round(c.s * 100);
        const l = Math.round(c.b * 100);
        return 'hsl(' + h + ',' + s + '%,' + l + '%)';
    }

    function makeCard(c) {
        const card = document.createElement('div');
        card.className = 'rounded-2xl border p-4';
        card.style.cssText = 'background: var(--card); border-color: var(--card-border);';
        const sw = document.createElement('div');
        sw.className = 'swatch rounded-lg h-16 mb-3';
        sw.style.background = hslColor(c);
        card.appendChild(sw);
        const title = document.createElement('h2');
        title.className = 'text-sm font-bold mb-0.5';
        title.style.cssText = 'color: var(--text-bright);';
        title.textContent = c.n;
        card.appendChild(title);
        const sub = document.createElement('p');
        sub.className = 'text-xs mb-3';
        sub.style.cssText = 'color: var(--muted);';
        sub.textContent = c.m + ' · ' + c.t;
        card.appendChild(sub);
        const hslText = document.createElement('p');
        hslText.className = 'text-[11px] font-mono';
        hslText.style.cssText = 'color: var(--muted-2);';
        hslText.textContent = 'H ' + c.h.toFixed(2) + (c.hs === 'L' ? ' L' : ' R') + '  ·  S ' + c.s.toFixed(2) + (c.ss === 'L' ? ' L' : ' R') + '  ·  B ' + c.b.toFixed(2) + (c.bs === 'L' ? ' L' : ' R');
        card.appendChild(hslText);
        return card;
    }

    function render() {
        grid.innerHTML = '';
        if (!currentMake && !searchQuery) {
            emptyMsg.textContent = translations[lang]['colors-pick'];
            emptyMsg.classList.remove('hidden');
            return;
        }
        let list = allColors;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            list = list.filter(c => c.n.toLowerCase().includes(q) || c.m.toLowerCase().includes(q) || c.t.toLowerCase().includes(q));
        } else if (currentMake) {
            list = list.filter(c => c.m === currentMake);
        }
        if (list.length === 0) {
            emptyMsg.textContent = translations[lang]['colors-empty'];
            emptyMsg.classList.remove('hidden');
            return;
        }
        emptyMsg.classList.add('hidden');
        const doc = document.createDocumentFragment();
        list.forEach(c => doc.appendChild(makeCard(c)));
        grid.appendChild(doc);
    }

    function buildTabs() {
        makesBar.innerHTML = '';
        const sorted = Object.keys(allMakes).sort((a, b) => a.localeCompare(b));
        sorted.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'make-tab';
            btn.textContent = m;
            btn.addEventListener('click', () => {
                currentMake = currentMake === m ? null : m;
                document.querySelectorAll('.make-tab').forEach(b => b.classList.toggle('active', b === btn && currentMake === m));
                render();
            });
            makesBar.appendChild(btn);
        });
    }

    let allMakes = {};
    fetch('/narzedzia/kolory.json')
        .then(r => r.json())
        .then(data => {
            allColors = data.colors;
            allMakes = data.makes;
            buildTabs();
            render();
        })
        .catch(() => {
            emptyMsg.textContent = (lang === 'en' ? 'Failed to load colors' : 'Nie udało się wczytać kolorów');
            emptyMsg.classList.remove('hidden');
        });

    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value.trim();
        currentMake = null;
        document.querySelectorAll('.make-tab').forEach(b => b.classList.remove('active'));
        render();
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    // Particles
    const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    function initColorParticles() {
        if (typeof tsParticles === 'undefined') return;
        try {
            const color = getComputedStyle(document.documentElement).getPropertyValue('--particle').trim() || '#ffffff';
            tsParticles.load('particles-js', {
                fpsLimit: 60,
                particles: {
                    number: { value: 40, density: { enable: true } },
                    color: { value: color },
                    opacity: { value: 0.25, random: true },
                    size: { value: 2, random: true },
                    move: { enable: true, speed: 0.4, direction: 'none', random: true },
                    links: { enable: true, distance: 150, color: color, opacity: 0.08, width: 1 },
                },
                interactivity: { events: { onHover: { enable: true, mode: 'grab' } }, modes: { grab: { distance: 150, links: { opacity: 0.15 } } } },
                background: { color: 'transparent' },
            });
        } catch (e) {}
    }
    if (!isTouch) initColorParticles();
    </script>
</body>
</html>
